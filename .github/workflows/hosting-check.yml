name: Hosting check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-build:
    name: Vercel-ready web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Production build
        env:
          VITE_GANTRY_API_URL: https://api.example.com
        run: npm run build

      - name: Deploy invariants
        run: |
          test -f vercel.json
          test -f src/deploy/invariants.ts
          test -f ../docs/hosting/PLAN.md
          rg '"destination": "/index.html"' vercel.json

  api-cors:
    name: API CORS config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API deps
        run: pip install -q python-dotenv structlog fastapi

      - name: pytest CORS
        run: python -m pytest tests/test_cors_config.py -q
